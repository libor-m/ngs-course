    dest: "{{ build_dir }}"
    remote_src: true
  become_user: "{{ admin_users[0] }}"
  when: not bedtools_stat.stat.exists

- name: Find bedtools source directory
  ansible.builtin.shell: "ls -dt {{ build_dir }}/bedtools*/ | head -1"
  register: bedtools_src
  changed_when: false
  when: not bedtools_stat.stat.exists

- name: Build and install bedtools
  ansible.builtin.shell: |
    make
  args:
    chdir: "{{ bedtools_src.stdout }}"
    creates: /usr/local/bin/bedtools
  become_user: "{{ admin_users[0] }}"
  when: not bedtools_stat.stat.exists

- name: Install bedtools
  ansible.builtin.command: make install
  args:
    chdir: "{{ bedtools_src.stdout }}"
    creates: /usr/local/bin/bedtools
  when: not bedtools_stat.stat.exists
