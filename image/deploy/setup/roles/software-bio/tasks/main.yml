- name: Check for bedtools
  ansible.builtin.stat:
    path: /usr/local/bin/bedtools
  register: bedtools_stat

- name: Download bedtools
  ansible.builtin.get_url:
    url: "{{ bedtools_url }}"
    dest: "{{ build_dir }}/bedtools-{{ bedtools_version }}.tar.gz"
    mode: "0644"
  become_user: "{{ admin_users[0] }}"
  when: not bedtools_stat.stat.exists

- name: Extract bedtools
  ansible.builtin.unarchive:
