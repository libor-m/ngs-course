---
- name: Install bioinformatics build dependencies
  ansible.builtin.apt:
    name:
      - zlib1g-dev
      - libbz2-dev
      - liblzma-dev
      - libcurl4-openssl-dev
      - libssl-dev
      - libncurses-dev
      - libncurses5-dev
      - unzip
      - default-jre-headless
      - perl
    state: present
    update_cache: true

- name: Ensure build directory exists
  ansible.builtin.file:
    path: "{{ build_dir }}"
    state: directory
    owner: "{{ admin_users[0] }}"
    group: "{{ admin_users[0] }}"
    mode: "0755"

- name: Check for FastQC
  ansible.builtin.stat:
    path: /usr/local/bin/fastqc
  register: fastqc_stat

- name: Download FastQC
  ansible.builtin.get_url:
    url: "{{ fastqc_url }}"
    dest: "{{ build_dir }}/fastqc-{{ fastqc_version }}.zip"
    mode: "0644"
  become_user: "{{ admin_users[0] }}"
  when: not fastqc_stat.stat.exists

- name: Extract FastQC
  ansible.builtin.unarchive:
    src: "{{ build_dir }}/fastqc-{{ fastqc_version }}.zip"
    dest: "{{ build_dir }}"
    remote_src: true
  become_user: "{{ admin_users[0] }}"
  when: not fastqc_stat.stat.exists

- name: Ensure FastQC is executable
  ansible.builtin.file:
    path: "{{ build_dir }}/FastQC/fastqc"
    state: file
    mode: "0755"
  become_user: "{{ admin_users[0] }}"
  when: not fastqc_stat.stat.exists

- name: Install FastQC to /opt
  ansible.builtin.copy:
    src: "{{ build_dir }}/FastQC"
    dest: /opt/
    mode: "0755"
    remote_src: true
  when: not fastqc_stat.stat.exists

- name: Link FastQC
  ansible.builtin.file:
    src: /opt/FastQC/fastqc
    dest: /usr/local/bin/fastqc
    state: link
    force: true
  when: not fastqc_stat.stat.exists

- name: Check for tabtk
  ansible.builtin.stat:
    path: /usr/local/bin/tabtk
  register: tabtk_stat

- name: Clone tabtk
  ansible.builtin.git:
    repo: https://github.com/lh3/tabtk.git
    dest: "{{ build_dir }}/tabtk"
    update: false
  become_user: "{{ admin_users[0] }}"
  when: not tabtk_stat.stat.exists

- name: Build tabtk
  ansible.builtin.command: make
  args:
    chdir: "{{ build_dir }}/tabtk"
  become_user: "{{ admin_users[0] }}"
  when: not tabtk_stat.stat.exists

- name: Install tabtk
  ansible.builtin.copy:
    src: "{{ build_dir }}/tabtk/tabtk"
    dest: /usr/local/bin/tabtk
    mode: "0755"
    remote_src: true
  when: not tabtk_stat.stat.exists

- name: Check for vcftools
  ansible.builtin.stat:
    path: /usr/local/bin/vcftools
  register: vcftools_stat

- name: Download vcftools
  ansible.builtin.get_url:
    url: "{{ vcftools_url }}"
    dest: "{{ build_dir }}/vcftools-{{ vcftools_version }}.tar.gz"
    mode: "0644"
  become_user: "{{ admin_users[0] }}"
  when: not vcftools_stat.stat.exists

- name: Extract vcftools
  ansible.builtin.unarchive:
    src: "{{ build_dir }}/vcftools-{{ vcftools_version }}.tar.gz"
    dest: "{{ build_dir }}"
    remote_src: true
  become_user: "{{ admin_users[0] }}"
  when: not vcftools_stat.stat.exists

- name: Build and install vcftools
  ansible.builtin.shell: |
    ./autogen.sh
    ./configure
    make
  args:
    chdir: "{{ build_dir }}/vcftools-{{ vcftools_version }}"
    creates: /usr/local/bin/vcftools
  become_user: "{{ admin_users[0] }}"
  when: not vcftools_stat.stat.exists

- name: Install vcftools
  ansible.builtin.command: make install
  args:
    chdir: "{{ build_dir }}/vcftools-{{ vcftools_version }}"
    creates: /usr/local/bin/vcftools
  when: not vcftools_stat.stat.exists

- name: Check for htslib (bgzip)
  ansible.builtin.stat:
    path: /usr/local/bin/bgzip
  register: htslib_stat

- name: Download htslib
  ansible.builtin.get_url:
    url: "{{ htslib_url }}"
    dest: "{{ build_dir }}/htslib-{{ htslib_version }}.tar.bz2"
    mode: "0644"
  become_user: "{{ admin_users[0] }}"
  when: not htslib_stat.stat.exists

- name: Extract htslib
  ansible.builtin.unarchive:
    src: "{{ build_dir }}/htslib-{{ htslib_version }}.tar.bz2"
    dest: "{{ build_dir }}"
    remote_src: true
  become_user: "{{ admin_users[0] }}"
  when: not htslib_stat.stat.exists

- name: Build and install htslib
  ansible.builtin.shell: |
    ./configure --prefix=/usr/local
    make
  args:
    chdir: "{{ build_dir }}/htslib-{{ htslib_version }}"
    creates: /usr/local/bin/bgzip
  become_user: "{{ admin_users[0] }}"
  when: not htslib_stat.stat.exists

- name: Install htslib
  ansible.builtin.shell: |
    make install
    ldconfig
  args:
    chdir: "{{ build_dir }}/htslib-{{ htslib_version }}"
    creates: /usr/local/bin/bgzip
  when: not htslib_stat.stat.exists

